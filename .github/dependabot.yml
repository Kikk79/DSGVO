version: 2
updates:
  # npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Kikk79"
    assignees:
      - "Kikk79"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps): "
      prefix-development: "chore(deps-dev): "
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"
    versioning-strategy: "auto"

  # Cargo (Rust) dependency updates
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
    open-pull-requests-limit: 3
    reviewers:
      - "Kikk79"
    assignees:
      - "Kikk79"
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps): "
      include: "scope"
    allow:
      - dependency-type: "all"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Kikk79"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci: "
      include: "scope"
