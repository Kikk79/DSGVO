name: Build Android APK

on:
  push:
    branches: [ master, main, mobile, dev, Dev ]
  pull_request:
    branches: [ master, main, mobile, dev, Dev ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      run: npm run build

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli

    - name: Sync Capacitor Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android


    - name: Accept Android licenses
      run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || echo "License acceptance failed, continuing..."

    - name: Build Android APK (Debug)
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Build Android APK (Release)
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: schuelerbeobachtung-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: schuelerbeobachtung-release-apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dev'
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: apk-${{ github.run_number }}
        name: Android APK Build ${{ github.run_number }}
        body: |
          Automatically built Android APK for Schuelerbeobachtung

          **Downloads:**
          - Debug APK: For testing and development
          - Release APK: For production use
        files: |
          android/app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/release/*.apk