name: Build Android APK

on:
  push:
    branches: [ master, main, mobile ]
  pull_request:
    branches: [ master, main, mobile ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      run: npm run build

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli

    - name: Add Capacitor Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Copy web assets to Android
      run: npx cap copy android

    - name: Update Android project
      run: npx cap update android

    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Build Android APK (Debug)
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Build Android APK (Release)
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: schuelerbeobachtung-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: schuelerbeobachtung-release-apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: apk-${{ github.run_number }}
        release_name: Android APK Build ${{ github.run_number }}
        body: |
          Automatically built Android APK for Schuelerbeobachtung

          **Changes in this build:**
          ${{ github.event.head_commit.message }}

          **Downloads:**
          - Debug APK: For testing and development
          - Release APK: For production use

          **Installation:**
          1. Download the APK file
          2. Enable "Install from unknown sources" on your Android device
          3. Install the APK
        draft: false
        prerelease: false