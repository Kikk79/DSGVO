name: PR Quality Gate

on:
  pull_request:
    branches: [master, Dev]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          override: true

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
        continue-on-error: false

      - name: TypeScript type checking
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Vitest unit tests
        run: npm test -- --run --reporter=verbose
        continue-on-error: false

      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: false

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check
        continue-on-error: false

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --verbose
        continue-on-error: false

      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });

            const failedChecks = checkRuns.check_runs.filter(run => run.conclusion === 'failure');
            const successChecks = checkRuns.check_runs.filter(run => run.conclusion === 'success');

            const body = `## Quality Gate Report

            ✅ Passed: ${successChecks.length}
            ❌ Failed: ${failedChecks.length}

            ${failedChecks.length > 0 ? '### Failed Checks\n' + failedChecks.map(c => `- ${c.name}`).join('\n') : ''}

            ${failedChecks.length === 0 ? '🎉 All quality checks passed!' : '⚠️ Fix failing checks before merging.'}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: npm audit
        run: npm audit --production --audit-level=moderate
        continue-on-error: true

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit
          cargo audit
        continue-on-error: true

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
