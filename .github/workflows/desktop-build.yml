name: Multi-Platform Desktop Build

on:
  push:
    branches: [main, master, Dev]
  workflow_dispatch:
  schedule:
    # Run nightly builds to catch regressions
    - cron: '0 2 * * *'

permissions:
  contents: read
  actions: read

jobs:
  build-check:
    name: Pre-build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend build
        run: npm run build

      - name: Check Rust build (debug)
        working-directory: src-tauri
        run: cargo check
        continue-on-error: true

      - name: Check Rust format
        working-directory: src-tauri
        run: cargo fmt -- --check
        continue-on-error: true

  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-20.04
    needs: build-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libglib2.0-bin \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libpango1.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            curl \
            wget \
            openssl

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build the app (Linux)
        run: npm run tauri:build
        continue-on-error: true
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY || '' }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || '' }}

      - name: Check for build artifacts
        run: |
          if [ -d "src-tauri/target/release/bundle/" ]; then
            echo "✅ Build directory created"
            find src-tauri/target/release/bundle -type f -name "*.deb" -o -name "*.AppImage" | head -5
          else
            echo "❌ No build directory found"
          fi

      - name: Upload artifacts (Linux)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: |
            src-tauri/target/release/build/
          retention-days: 7

  build-windows:
    name: Build Windows (.msi)
    runs-on: windows-latest
    needs: build-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build the app (Windows)
        run: npm run tauri:build
        continue-on-error: true
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY || '' }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || '' }}

      - name: Check for build artifacts
        run: |
          if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/") {
            echo "✅ Build directory created"
            Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/" -Include "*.msi","*.exe" -Recurse | Select-Object -First 5
          } else {
            echo "❌ No build directory found"
          }

      - name: Upload artifacts (Windows)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/build/
          retention-days: 7

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    needs: build-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: '--target aarch64-apple-darwin'
            name: 'macos-arm64'
          - args: '--target x86_64-apple-darwin'
            name: 'macos-x64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build the app (macOS)
        run: npm run tauri:build ${{ matrix.args }}
        continue-on-error: true
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY || '' }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || '' }}

      - name: Check for build artifacts
        run: |
          if [ -d "src-tauri/target/aarch64-apple-darwin/release/bundle/" ] || [ -d "src-tauri/target/x86_64-apple-darwin/release/bundle/" ]; then
            echo "✅ Build directory created"
            find src-tauri/target/*/release/bundle -type f -name "*.dmg" | head -5
          else
            echo "❌ No build directory found"
          fi

      - name: Upload artifacts (macOS)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}-logs
          path: |
            src-tauri/target/*/release/build/
          retention-days: 7

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Create build summary
        run: |
          cat > build-report.md << 'EOF'
          # Multi-Platform Build Report
          
          **Build Date**: $(date)
          **Repository**: ${{ github.repository }}
          **Branch**: ${{ github.ref }}
          **Commit**: ${{ github.sha }}
          
          ## Build Status
          
          | Platform | Status | Details |
          |----------|--------|---------|
          | Linux (.deb/.AppImage) | ${{ needs.build-linux.result }} | Check artifacts or logs |
          | Windows (.msi/.exe) | ${{ needs.build-windows.result }} | Check artifacts or logs |
          | macOS ARM64 (.dmg) | ${{ needs.build-macos.result }} | Check artifacts or logs |
          | macOS x86_64 (.dmg) | ${{ needs.build-macos.result }} | Check artifacts or logs |
          
          ## Artifact Downloads
          
          All build artifacts are available in the GitHub Actions run:
          [View Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ## Troubleshooting
          
          If builds fail:
          1. Check individual build logs in artifacts
          2. Review tauri configuration in `src-tauri/tauri.conf.json`
          3. Verify all dependencies are installed
          4. Check for platform-specific build issues
          
          ---
          *Generated by GitHub Actions*
          EOF
          cat build-report.md

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
          retention-days: 30
