name: Security Scanning

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: npm audit
        id: npm-audit
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --audit-level=high
        continue-on-error: true

      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: npm-audit.json

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit
          cargo audit --json > ../cargo-audit.json || true
          cargo audit
        continue-on-error: true

      - name: Upload cargo audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-results
          path: cargo-audit.json

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          npx license-checker --summary --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD" || true

  sast-analysis:
    name: SAST Analysis (SonarQube)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: SonarQube Scan (if token available)
        uses: SonarSource/sonarcloud-github-action@master
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  dependency-report:
    name: Dependency Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate npm dependency tree
        run: |
          npm ls --depth=0 > npm-dependencies.txt || true
          npx depcheck --json > depcheck.json || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate cargo dependency tree
        working-directory: src-tauri
        run: |
          cargo tree > ../cargo-dependencies.txt || true
          cargo generate-lockfile

      - name: Upload dependency reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            npm-dependencies.txt
            depcheck.json
            cargo-dependencies.txt
          retention-days: 30

  report:
    name: Security Report Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, codeql-analysis, secret-scan, license-compliance, sast-analysis, dependency-report]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create comprehensive security report
        run: |
          echo "# Comprehensive Security Scan Report" > security-report.md
          echo "" >> security-report.md
          echo "**Generated**: $(date)" >> security-report.md
          echo "**Repository**: ${{ github.repository }}" >> security-report.md
          echo "**Branch**: ${{ github.ref }}" >> security-report.md
          echo "**Commit**: ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          echo "## Executive Summary" >> security-report.md
          echo "" >> security-report.md
          echo "| Scan Type | Status | Details |" >> security-report.md
          echo "|-----------|--------|---------|" >> security-report.md
          echo "| Dependency Vulnerabilities | ${{ needs.dependency-scan.result }} | npm + cargo audit |" >> security-report.md
          echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} | JavaScript/TypeScript SAST |" >> security-report.md
          echo "| Secret Detection | ${{ needs.secret-scan.result }} | TruffleHog OSS |" >> security-report.md
          echo "| License Compliance | ${{ needs.license-compliance.result }} | Approved licenses only |" >> security-report.md
          echo "| SAST Analysis | ${{ needs.sast-analysis.result }} | SonarQube (if configured) |" >> security-report.md
          echo "| Dependency Report | ${{ needs.dependency-report.result }} | Full dependency trees |" >> security-report.md
          echo "" >> security-report.md
          echo "## Recommendations" >> security-report.md
          echo "" >> security-report.md
          echo "1. Review any failing scans above" >> security-report.md
          echo "2. Address high/critical vulnerabilities immediately" >> security-report.md
          echo "3. Update dependencies regularly" >> security-report.md
          echo "4. Monitor secret scan results" >> security-report.md
          echo "5. Maintain license compliance" >> security-report.md
          echo "" >> security-report.md
          echo "---" >> security-report.md
          echo "Security scan completed as part of GitHub Actions CI/CD pipeline." >> security-report.md

      - name: Upload comprehensive security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 90

      - name: Comment on PR if applicable
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            }).catch(() => console.log('Could not post comment (not a PR)'))
